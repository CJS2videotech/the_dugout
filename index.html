<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>The Dugout - Daily Picks</title>

<!-- iOS/Android Home Screen App Icons & PWA Capabilities -->
<link href="https://fonts.googleapis.com/css2?family=Graduate&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ── RESET & BASE ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#090d14; --card:rgba(20, 25, 35, 0.45); --card2:rgba(30, 40, 60, 0.35);
  --border:rgba(255,255,255,0.12); --border-light:rgba(255,255,255,0.22);
  --text:#e8edf5; --muted:#cbd5e1;
  --green:#22c55e;
  
  /* User Themes */
  --u-andrea-1: #0a2351; --u-andrea-2: #ffc52f;
  --u-cj-1: #0e3386; --u-cj-2: #cc3433;
}
body{
  font-family:'Inter',system-ui,sans-serif;
  background-color:var(--bg); color:var(--text); min-height:100vh;
  position: relative;
  padding: 2rem 0;
}
body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  z-index: -10;
  background-image: url('assets/Cubs%20field.jpg');
  background-size: cover;
  background-position: center top;
  background-repeat: no-repeat;
}
.glass{ 
  background: var(--card);
  backdrop-filter: blur(16px); 
  -webkit-backdrop-filter: blur(16px); 
  border: 1px solid var(--border);
  border-top: 1px solid var(--border-light);
  border-left: 1px solid var(--border-light);
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.35);
}
.b-pip{width:8px; height:8px; border-radius:50%; background:#fff;}
.rbtn{ background:transparent; border:1px solid var(--border); color:var(--muted); padding:6px 12px; border-radius:6px; font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; display:flex; align-items:center; gap:6px; transition:all .2s;}
.rbtn:hover{ color:#fff; border-color:#fff; }

/* ── DAILY PICKS ── */
.dp-sec{ max-width:900px; margin:0 auto 2rem; padding:0 2rem; }
.dp-wrap{ display:flex; flex-wrap:wrap; gap:2rem; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.5rem; }
.dp-input-area{ flex:1; min-width:300px; }
.dp-recent-area{ flex:1; min-width:300px; display:flex; flex-direction:column; }
.dp-label{ display:block; font-family:'Oswald',sans-serif; font-size:11px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-bottom:4px; }
.dp-select{ width:100%; background:rgba(0,0,0,0.4); border:1px solid var(--border); color:#fff; padding:10px 12px; border-radius:8px; font-family:'Inter',sans-serif; outline:none; appearance:none; cursor:pointer; }
.dp-select:focus{ border-color:var(--green); }
.select-wrap{ position:relative; }
.select-wrap::after{ content:'▼'; position:absolute; right:12px; top:50%; transform:translateY(-50%); font-size:10px; color:var(--muted); pointer-events:none; }
.dp-btn{ width:100%; background:var(--green); color:#000; border:none; padding:12px; border-radius:8px; font-family:'Oswald',sans-serif; font-size:1.1rem; letter-spacing:1px; text-transform:uppercase; cursor:pointer; font-weight:700; box-shadow:0 0 15px rgba(34,197,94,0.3); transition:all .2s; }
.dp-btn:hover{ background:#4ade80; box-shadow:0 0 20px rgba(34,197,94,0.5); transform:translateY(-1px); }
.dp-list{ flex:1; display:flex; flex-direction:column; gap:8px; max-height:230px; overflow-y:auto; padding-right:5px; }
.dp-list::-webkit-scrollbar{ width:4px; }
.dp-list::-webkit-scrollbar-thumb{ background:var(--border-light); border-radius:4px; }
.dp-item{ background:rgba(0,0,0,0.2); border:1px solid var(--border); border-left:3px solid transparent; border-radius:8px; padding:10px 12px; display:flex; justify-content:space-between; align-items:center; }
.dp-badge{ padding:2px 6px; border-radius:4px; font-family:'Oswald',sans-serif; font-size:10px; letter-spacing:1px; text-transform:uppercase; }
.dp-pending{ background:rgba(255,255,255,0.1); color:#fff; }
.dp-win{ background:rgba(34,197,94,.15); color:#4ade80; }
.dp-loss{ background:rgba(239,68,68,.15); color:#f87171; }

/* ── TRADES & ACQUISITIONS WIRE ── */
.tx-wrap{ margin-top:2rem; border-radius:12px; padding:1.25rem 1.5rem; }
.tx-head{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:1rem; }
.tx-title{ font-family:'Oswald',sans-serif; font-size:1.2rem; letter-spacing:1px; text-transform:uppercase; display:flex; align-items:center; gap:8px; }
.tx-controls{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:0.85rem; }
.tx-pills{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.tx-pill{ background:rgba(0,0,0,0.35); border:1px solid var(--border); color:var(--muted); padding:5px 11px; border-radius:20px; font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:0.8px; text-transform:uppercase; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:all .18s; }
.tx-pill:hover{ color:#fff; border-color:var(--border-light); }
.tx-pill.active{ background:rgba(34,197,94,0.18); border-color:#4ade80; color:#fff; box-shadow:0 0 10px rgba(34,197,94,0.2); }
.tx-pill-dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }
.tx-range{ background:rgba(0,0,0,0.45); border:1px solid var(--border); color:#fff; padding:5px 10px; border-radius:6px; font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:0.8px; text-transform:uppercase; cursor:pointer; outline:none; }
.tx-range:focus{ border-color:var(--green); }
.tx-meta{ font-size:11px; color:var(--muted); margin-bottom:0.75rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; }
.tx-list{ display:flex; flex-direction:column; gap:10px; max-height:460px; overflow-y:auto; padding-right:5px; }
.tx-list::-webkit-scrollbar{ width:5px; }
.tx-list::-webkit-scrollbar-thumb{ background:var(--border-light); border-radius:4px; }
.tx-card{ background:rgba(0,0,0,0.28); border:1px solid var(--border); border-left:4px solid var(--border-light); border-radius:10px; padding:12px 14px; transition:border-color .2s, background .2s; }
.tx-card:hover{ background:rgba(0,0,0,0.4); }
.tx-card.tx-inter{ background:linear-gradient(135deg, rgba(255,197,47,0.12), rgba(204,52,51,0.12)); border-color:rgba(251,191,36,0.45); border-left-color:#fbbf24; }
.tx-card-top{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:7px; }
.tx-who{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.tx-avatar{ width:26px; height:26px; border-radius:50%; object-fit:cover; object-position:top; border:2px solid var(--border-light); }
.tx-team-tag{ font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:0.7px; text-transform:uppercase; font-weight:600; }
.tx-badges{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.tx-badge{ padding:2px 7px; border-radius:4px; font-family:'Oswald',sans-serif; font-size:10px; letter-spacing:0.9px; text-transform:uppercase; font-weight:600; }
.tx-b-trade{ background:rgba(245,158,11,0.2); color:#fbbf24; border:1px solid rgba(245,158,11,0.35); }
.tx-b-acq{ background:rgba(34,197,94,0.18); color:#4ade80; border:1px solid rgba(34,197,94,0.35); }
.tx-b-dep{ background:rgba(239,68,68,0.18); color:#f87171; border:1px solid rgba(239,68,68,0.35); }
.tx-b-other{ background:rgba(148,163,184,0.16); color:#cbd5e1; border:1px solid rgba(148,163,184,0.25); }
.tx-b-inter{ background:rgba(251,191,36,0.25); color:#fde047; border:1px solid rgba(253,224,71,0.55); }
.tx-b-milb{ background:rgba(99,102,241,0.2); color:#a5b4fc; border:1px solid rgba(129,140,248,0.3); }
.tx-date{ font-size:11px; color:var(--muted); font-family:'Oswald',sans-serif; letter-spacing:0.5px; }
.tx-players{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:7px; }
.tx-player{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:14px; font-size:11.5px; font-weight:500; text-decoration:none; border:1px solid var(--border); background:rgba(255,255,255,0.06); color:#f1f5f9; transition:all .15s; }
a.tx-player:hover{ background:rgba(255,255,255,0.14); border-color:var(--border-light); transform:translateY(-1px); }
.tx-p-in{ border-color:rgba(74,222,128,0.35); background:rgba(34,197,94,0.12); }
.tx-p-out{ border-color:rgba(248,113,113,0.35); background:rgba(239,68,68,0.1); }
.tx-desc{ font-size:12.5px; color:#e2e8f0; line-height:1.45; }
.tx-empty{ color:var(--muted); font-size:12.5px; text-align:center; padding:1.5rem 1rem; font-style:italic; }

</style>
</head>
<body>

<div class="dp-sec">
  
  <div style="font-family:'Oswald',sans-serif; font-size:1.2rem; letter-spacing:1px; text-transform:uppercase; margin-bottom:1rem; display:flex; align-items:center; justify-content:center; gap:8px; padding-bottom:20px;">
    The Dugout
  </div>

  <div style="font-family:'Oswald',sans-serif; font-size:1.2rem; letter-spacing:1px; text-transform:uppercase; margin-bottom:1rem; display:flex; align-items:center; gap:8px;">
    <div class="b-pip" style="background:#10b981;"></div> Daily Picks Leaderboard
  </div>
  <div class="dp-leader-grid" id="dp-leaderboard" style="display:flex; flex-wrap:wrap; gap:1rem; margin-bottom:2rem;">
    <!-- Populated by JS -->
  </div>

  <div style="font-family:'Oswald',sans-serif; font-size:1.2rem; letter-spacing:1px; text-transform:uppercase; margin-bottom:1rem; display:flex; align-items:center; gap:8px;">
    <div class="b-pip" style="background:#ffc52f;"></div> 🏆 Ultimate Trophy Cabinet
  </div>
  <div id="trophy-leaderboard" style="display:flex; flex-direction:column; gap:1rem; margin-bottom:2rem;">
    <!-- Populated by JS -->
  </div>

  <div class="message-board-wrap glass" style="margin-bottom:2rem; padding:1.25rem;">
    <div style="font-family:'Oswald',sans-serif; font-size:1.2rem; letter-spacing:1px; text-transform:uppercase; margin-bottom:1rem; display:flex; align-items:center; gap:8px;">
      <div class="b-pip" style="background:#ef4444;"></div> The Dugout Chatter
    </div>
    <div id="chat-list" style="max-height:250px; overflow-y:auto; margin-bottom:1rem; display:flex; flex-direction:column; gap:8px; padding-right:8px;">
      <!-- JS populates -->
    </div>
    <div style="display:flex; gap:8px; align-items:stretch;">
      <div class="select-wrap" style="width:120px; flex-shrink:0;">
        <select id="chat-who" class="dp-select" style="height:100%; border-radius:6px;">
          <option value="" disabled selected>Who?</option>
          <option value="andrea">Andrea</option>
          <option value="cj">CJ</option>
        </select>
      </div>
      <input type="text" id="chat-input" placeholder="Enter your message..." style="flex:1; background:var(--card2); border:1px solid var(--border); border-radius:6px; color:#fff; padding:8px 12px; font-family:'Inter',sans-serif; outline:none; font-size:0.9rem;" onkeypress="if(event.key==='Enter') postChat()">
      <button onclick="postChat()" class="dp-btn" style="padding:8px 16px; width:auto; border-radius:6px; flex-shrink:0;">Post</button>
    </div>
  </div>

  <div class="dp-wrap glass">
    <div class="dp-input-area">
      <div style="display:flex; align-items:center; gap:8px; font-family:'Oswald',sans-serif; font-size:1.2rem; letter-spacing:1px; text-transform:uppercase; margin-bottom:1rem;">
        <div class="b-pip" style="background:#f59e0b;"></div> Daily Pick
      </div>
      <div style="background:var(--card2); border:1px solid var(--border); border-radius:10px; padding:1.25rem;">
        <div style="display:flex; gap:1rem; margin-bottom:1rem; flex-wrap:wrap;">
          <div style="flex:1; min-width:130px;">
            <label class="dp-label">Who is Picking?</label>
            <div class="select-wrap">
              <select id="dp-who" class="dp-select">
                <option value="" disabled selected>-- Select --</option>
                <option value="andrea">Andrea</option>
                <option value="cj">CJ</option>
              </select>
            </div>
          </div>
          <div style="flex:1; min-width:130px;">
            <label class="dp-label">Date</label>
            <div class="select-wrap">
              <select id="dp-date" class="dp-select" onchange="loadGamesForDate()">
                <option value="yesterday">Yesterday</option>
                <option value="today" selected>Today</option>
                <option value="tomorrow">Tomorrow</option>
              </select>
            </div>
          </div>
        </div>
        <div id="dp-input-fields">
          <div style="margin-bottom:1rem;">
            <label class="dp-label">Game</label>
            <div class="select-wrap">
              <select id="dp-game" class="dp-select" onchange="populateWinners()">
                <option value="" disabled selected>-- Select a game --</option>
              </select>
            </div>
          </div>
          <div style="margin-bottom:1.5rem;">
            <label class="dp-label">Winner</label>
            <div class="select-wrap">
              <select id="dp-winner" class="dp-select">
                <option value="" disabled selected>Select game first</option>
              </select>
            </div>
          </div>
          <button onclick="submitDailyPick()" class="dp-btn">Lock It In</button>
        </div>
      </div>
    </div>
    
    <div class="dp-recent-area">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.75rem;">
        <div id="dp-recent-title" style="display:flex; align-items:center; gap:8px; font-family:'Oswald',sans-serif; font-size:11px; color:var(--muted); letter-spacing:1px; text-transform:uppercase;">
          <div class="b-pip" style="background:var(--border-light); width:6px; height:6px;"></div> Recent Picks
        </div>
        <button onclick="clearPicks()" class="rbtn" style="padding:4px 8px; font-size:9px; border:none; color:var(--muted);">CLEAR HISTORY</button>
      </div>
      <div id="dp-recent-list" class="dp-list">
        <!-- JS populates -->
      </div>
    </div>
  </div>

  <!-- TRADES & ACQUISITIONS WIRE -->
  <div class="tx-wrap glass">
    <div class="tx-head">
      <div class="tx-title">
        <div class="b-pip" style="background:#38bdf8;"></div> Trades &amp; Acquisitions Wire
      </div>
      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
        <select id="tx-range" class="tx-range" onchange="loadTransactions()">
          <option value="30">Last 30 Days</option>
          <option value="90" selected>Last 90 Days</option>
          <option value="180">Last 180 Days</option>
          <option value="365">Past Year</option>
        </select>
        <button onclick="loadTransactions()" class="rbtn" id="tx-refresh-btn">↻ Refresh</button>
      </div>
    </div>
    <div class="tx-controls">
      <div class="tx-pills" id="tx-team-pills">
        <!-- Populated by JS -->
      </div>
    </div>
    <div class="tx-controls" style="margin-bottom:0.6rem;">
      <div class="tx-pills" id="tx-cat-pills">
        <button class="tx-pill active" data-cat="headlines" onclick="setTxCategory('headlines')">Headlines</button>
        <button class="tx-pill" data-cat="trade" onclick="setTxCategory('trade')">Trades</button>
        <button class="tx-pill" data-cat="acquired" onclick="setTxCategory('acquired')">Acquisitions &amp; Signings</button>
        <button class="tx-pill" data-cat="departure" onclick="setTxCategory('departure')">Departures</button>
        <button class="tx-pill" data-cat="all" onclick="setTxCategory('all')">All Moves</button>
      </div>
    </div>
    <div class="tx-meta">
      <span id="tx-summary">Loading team transactions...</span>
      <span style="opacity:0.75;">Click any player chip for MLB stats</span>
    </div>
    <div id="tx-list" class="tx-list">
      <div class="tx-empty">Loading MLB trades &amp; acquisitions...</div>
    </div>
  </div>
</div>

<script>
const USERS = [
  { id: 'andrea', name: 'Andrea', teamName: 'Brewers', teamId: 158, primary: 'var(--u-andrea-1)', secondary: 'var(--u-andrea-2)', img: 'assets/andrea.jpg' },
  { id: 'cj', name: 'CJ', teamName: 'Cubs', teamId: 112, primary: 'var(--u-cj-1)', secondary: 'var(--u-cj-2)', img: 'assets/cj.jpg' }
];
const TEAM_IDS = USERS.map(u => u.teamId).join(',');
const MLB = 'https://statsapi.mlb.com/api/v1';

function isoDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

/* ── CHATTER LOGIC ── */
let chatHistory = JSON.parse(localStorage.getItem('theDugoutChats')) || [];

function saveChats() {
  localStorage.setItem('theDugoutChats', JSON.stringify(chatHistory));
  renderChats();
}

function postChat() {
  const who = document.getElementById('chat-who').value;
  const msg = document.getElementById('chat-input').value.trim();
  if(!who) return alert('Please select who you are first.');
  if(!msg) return;
  
  const user = USERS.find(u => u.id === who);
  chatHistory.push({
    id: Date.now(),
    who: user.id,
    whoName: user.name,
    msg: msg,
    timestamp: new Date().toISOString()
  });
  
  document.getElementById('chat-input').value = '';
  saveChats();
}

function deleteChat(id) {
  chatHistory = chatHistory.filter(c => c.id !== id);
  saveChats();
}

function renderChats() {
  const list = document.getElementById('chat-list');
  if(!list) return;
  if(chatHistory.length === 0) {
     list.innerHTML = '<div style="color:var(--muted); font-size:12px; text-align:center; padding:10px;">It\'s quiet in the dugout...</div>';
     return;
  }
  
  list.innerHTML = chatHistory.map(c => {
    const u = USERS.find(x => x.id === c.who);
    const col = u ? u.secondary : '#fff';
    const d = new Date(c.timestamp);
    const timeStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    
    return `<div style="background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.05); border-radius:8px; padding:10px; display:flex; gap:12px; position:relative;">
      <button onclick="deleteChat(${c.id})" style="position:absolute; top:8px; right:8px; background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px;">&times;</button>
      <img src="${u ? u.img : ''}" style="width:36px; height:36px; border-radius:50%; object-fit:cover; border:2px solid ${col};">
      <div style="flex:1;">
         <div style="display:flex; align-items:baseline; gap:8px; margin-bottom:4px;">
           <span style="font-family:'Oswald',sans-serif; font-size:14px; color:${col}; letter-spacing:0.5px;">${c.whoName}</span>
           <span style="font-size:10px; color:var(--muted);">${timeStr}</span>
         </div>
         <div style="font-size:13px; color:#e2e8f0; line-height:1.4;">${c.msg}</div>
      </div>
    </div>`;
  }).join('');
  
  list.scrollTop = list.scrollHeight;
}
/* ── END CHATTER LOGIC ── */

/* ── DAILY PICKS LOGIC ── */
let dpHistory = JSON.parse(localStorage.getItem('theDugoutDailyPicks')) || [];
let dpAvailableGames = []; 

async function loadGamesForDate() {
  const dateVal = document.getElementById('dp-date').value;
  const d = new Date();
  if(dateVal === 'yesterday') d.setDate(d.getDate()-1);
  if(dateVal === 'tomorrow') d.setDate(d.getDate()+1);
  const dateStr = isoDate(d);
  
  const inputContainer = document.getElementById('dp-input-fields');
  const recentTitle = document.getElementById('dp-recent-title');
  if (dateVal === 'yesterday') {
      inputContainer.style.display = 'none';
      recentTitle.innerHTML = `<div class="b-pip" style="background:#3b82f6; width:6px; height:6px;"></div> Yesterday's Recap`;
      renderRecentPicks(dateStr);
      return;
  } else {
      inputContainer.style.display = 'block';
      recentTitle.innerHTML = `<div class="b-pip" style="background:var(--border-light); width:6px; height:6px;"></div> Recent Picks`;
      renderRecentPicks();
  }
  
  const gameSelect = document.getElementById('dp-game');
  const winnerSelect = document.getElementById('dp-winner');
  gameSelect.innerHTML = '<option value="" disabled selected>Loading games...</option>';
  winnerSelect.innerHTML = '<option value="" disabled selected>Select game first</option>';
  
  try {
     const url=`${MLB}/schedule?sportId=1&date=${dateStr}&teamId=${TEAM_IDS},109&hydrate=team`; 
     const r = await fetch(url);
     const data = await r.json();
     dpAvailableGames = data.dates?.[0]?.games || [];
     
     if (dpAvailableGames.length === 0) {
        gameSelect.innerHTML = '<option value="" disabled selected>No games found</option>';
        return;
     }
     
     gameSelect.innerHTML = '<option value="" disabled selected>-- Select a game --</option>' + 
       dpAvailableGames.map(g => {
         let gh = g.gameNumber > 1 ? ` (Game ${g.gameNumber})` : '';
         const state = g.status.abstractGameState;
         const isStarted = state !== 'Preview' && state !== 'Pre-Game' && state !== 'Scheduled' && state !== 'Warmup';
         const lockedAttr = isStarted ? 'disabled' : '';
         const lockedText = isStarted ? ' [LOCKED]' : '';
         return `<option value="${g.gamePk}" ${lockedAttr}>${g.teams.away.team.name} @ ${g.teams.home.team.name}${gh}${lockedText}</option>`;
       }).join('');
       
  } catch (e) {
     gameSelect.innerHTML = '<option value="" disabled selected>Error loading</option>';
  }
}

function populateWinners() {
  const gamePk = document.getElementById('dp-game').value;
  const winnerSelect = document.getElementById('dp-winner');
  const g = dpAvailableGames.find(x => x.gamePk == gamePk);
  if (!g) return;
  
  winnerSelect.innerHTML = `
    <option value="" disabled selected>-- Select winner --</option>
    <option value="${g.teams.away.team.id}">${g.teams.away.team.name}</option>
    <option value="${g.teams.home.team.id}">${g.teams.home.team.name}</option>

function submitDailyPick() {
  const who = document.getElementById('dp-who').value;
  const dateVal = document.getElementById('dp-date').value;
  const gamePk = document.getElementById('dp-game').value;
  const winnerId = document.getElementById('dp-winner').value;
  
  if(!who || !gamePk || !winnerId) return alert('Please complete all fields.');
  
  const d = new Date();
  if(dateVal === 'yesterday') d.setDate(d.getDate()-1);
  if(dateVal === 'tomorrow') d.setDate(d.getDate()+1);
  const dateStr = isoDate(d);
  
  const user = USERS.find(u=>u.id===who);
  const g = dpAvailableGames.find(x => x.gamePk == gamePk);
  const state = g.status.abstractGameState;
  const isStarted = state !== 'Preview' && state !== 'Pre-Game' && state !== 'Scheduled' && state !== 'Warmup';
  if (isStarted) return alert('This game has already started and is locked. You cannot modify your pick.');
  
  const isAway = g.teams.away.team.id == winnerId;
  const teamName = isAway ? g.teams.away.team.name : g.teams.home.team.name;
  
  const existingIndex = dpHistory.findIndex(p => p.who === user.id && p.gamePk === parseInt(gamePk));
  let gh = g.gameNumber > 1 ? ` (Gm ${g.gameNumber})` : '';
  const pick = { id: Date.now(), who: user.id, whoName: user.name, dateStr, gamePk: parseInt(gamePk), teamId: parseInt(winnerId), teamName: teamName + gh, status: 'Pending', runs: undefined, hits: undefined };
  
  if (existingIndex >= 0) {
      alert('Updating previous pick for this game');
      dpHistory[existingIndex] = pick;
  } else {
      dpHistory.push(pick);
  }
  
  savePicks();
  renderLeaderboard();
  renderTrophyLeaderboard();
  
  document.getElementById('dp-game').value = '';
  document.getElementById('dp-winner').innerHTML = '<option value="" disabled selected>Select game first</option>';
}

function renderLeaderboard() {
  const grid = document.getElementById('dp-leaderboard');
  if(!grid) return;
  
  let stats = USERS.map(u => {
     let w=0, l=0, stk=0;
     const picks = dpHistory.filter(p => p.who === u.id && p.status!=='Pending').sort((a,b)=>a.id - b.id);
     picks.forEach(p => {
       if(p.status==='Win'){ w++; stk = stk>0 ? stk+1 : 1; }
       else { l++; stk = stk<0 ? stk-1 : -1; }
     });
     const tot = w+l;
     const pct = tot===0 ? 0 : w/tot;
     return { ...u, w, l, pct, stk, tot };
  });
  
  stats.sort((a,b) => {
     if(b.w !== a.w) return b.w - a.w;
     if(b.pct !== a.pct) return b.pct - a.pct;
     return b.stk - a.stk;
  });
  
  let topPlayerId = stats[0] && stats[0].tot > 0 && stats[0].w > 0 ? stats[0].id : null;

  grid.innerHTML = stats.map(s => {
     const pctStr = s.tot===0 ? '0%' : Math.round(s.pct*100)+'%';
     const isTop = s.id === topPlayerId;
     return `<div class="glass" style="flex:1; min-width:250px; border:1px solid var(--border); border-radius:12px; padding:12px; display:flex; align-items:center; gap:12px; position:relative; overflow:hidden;">

        <img src="${s.img}" style="width:60px; height:60px; border-radius:10px; object-fit:cover; border:2px solid ${s.secondary};">
        <div style="flex:1;">
           <div style="font-family:'Oswald',sans-serif; font-size:1.4rem; color:${s.secondary}; letter-spacing:1px; line-height:1; margin-bottom:4px; display:flex; align-items:center; gap:8px;">

           <div style="display:flex; align-items:center; gap:12px; font-size:13px;">
              <span style="font-weight:600;">${s.w}<span style="color:var(--muted);font-weight:400;font-size:11px;">W</span> ${s.l}<span style="color:var(--muted);font-weight:400;font-size:11px;">L</span></span>

function evaluatePicks(games, targetDate) {
  let changed = false;
  dpHistory.forEach(p => {
    // Only process if pending OR if runs/hits haven't been captured yet
    if(p.dateStr !== targetDate) return;
    if(p.status !== 'Pending' && p.runs !== undefined) return;
    
    const g = games.find(gm => gm.teams.away.team.id === p.teamId || gm.teams.home.team.id === p.teamId);
    if(g && (g.status.abstractGameState === 'Final' || g.status.abstractGameState === 'Completed Early')) {
       const isAway = g.teams.away.team.id === p.teamId;
       const awayS = g.teams.away.score||0, homeS = g.teams.home.score||0;
       
       // Record standard win/loss
       let didWin = isAway ? (awayS > homeS) : (homeS > awayS);
       if (awayS === homeS) didWin = false; 
       p.status = didWin ? 'Win' : 'Loss';
       
       // Record Runs and Hits for Trophy Engine
       const lsTeam = isAway ? g.linescore?.teams?.away : g.linescore?.teams?.home;
       p.runs = lsTeam?.runs || 0;
       p.hits = lsTeam?.hits || 0;
       
       changed = true;
    }
  });
  if(changed) {
    savePicks();
    renderLeaderboard();
  }
}

// Global update polling logic
async function updateBackgroundScores() {
   const todayStr = isoDate(new Date());
   let yd = new Date(); yd.setDate(yd.getDate()-1);
   const ydStr = isoDate(yd);
   
   try {
     // Include 109 explicitly, and add hydrate=team,linescore
     const r = await fetch(`${MLB}/schedule?sportId=1&date=${todayStr}&teamId=${TEAM_IDS},109&hydrate=team,linescore`);
     const data = await r.json();
     if(data.dates?.[0]?.games) evaluatePicks(data.dates[0].games, todayStr);
     
     const yr = await fetch(`${MLB}/schedule?sportId=1&date=${ydStr}&teamId=${TEAM_IDS},109&hydrate=team,linescore`);
     const ydata = await yr.json();
     if(ydata.dates?.[0]?.games) evaluatePicks(ydata.dates[0].games, ydStr);
     
     // After re-evaluating data, update the trophy leaderboard
     renderTrophyLeaderboard();
   } catch (e) {
     console.error("Failed to evaluate background scores:", e);
   }
}

function classifyTransactionGroup(g) {
  const code = (g.typeCode || '').toUpperCase();
  const desc = (g.typeDesc || '').toLowerCase();
  const trackedIds = new Set(USERS.map(u => u.teamId));

  if (code === 'TR' || desc.includes('trade')) return 'trade';

  const hasTrackedTo = g.players.some(p => p.toTeamId && trackedIds.has(p.toTeamId));
  const hasTrackedFrom = g.players.some(p => p.fromTeamId && trackedIds.has(p.fromTeamId));

  if (desc.includes('declared free agency') || desc.includes('elected free agency') ||
      desc.includes('designated for assignment') || desc.includes('released') ||
      desc.includes('non-tendered') || desc.includes('retired') || code === 'REL' || code === 'DES') {
    return 'departure';
  }
  if (code === 'CLW' || desc.includes('claimed off waivers')) {
    if (hasTrackedTo) return 'acquired';
    if (hasTrackedFrom) return 'departure';
  }
  if (code === 'SFA' || code === 'SGN' || code === 'PUR' || code === 'SEL' ||
      desc.includes('signed') || desc.includes('purchased') || desc.includes('selected') || desc.includes('acquired')) {
    return 'acquired';
  }
  return 'other';
}

function groupTransactions(rawList) {
  const map = new Map();
  const trackedIds = new Set(USERS.map(u => u.teamId));

  for (const t of rawList) {
    const key = t.id ? String(t.id) : `${t.date || t.effectiveDate || ''}|${t.description || ''}`;
    if (!map.has(key)) {
      map.set(key, {
        id: t.id || 0,
        date: t.date || t.effectiveDate || '',
        typeCode: t.typeCode || '',
        typeDesc: t.typeDesc || 'Roster Move',
        description: t.description || '',
        teamIds: new Set(),
        players: []
      });
    }
    const grp = map.get(key);
    if (t.description && t.description.length > grp.description.length) grp.description = t.description;
    if (t.fromTeam?.id) grp.teamIds.add(t.fromTeam.id);
    if (t.toTeam?.id) grp.teamIds.add(t.toTeam.id);

    if (t.person?.fullName) {
      const pKey = `${t.person.id || t.person.fullName}|${t.fromTeam?.id || ''}|${t.toTeam?.id || ''}`;
      if (!grp.players.some(p => p._k === pKey)) {
        grp.players.push({
          _k: pKey,
          id: t.person.id || null,
          name: t.person.fullName,
          fromTeamId: t.fromTeam?.id || null,
          fromTeamName: t.fromTeam?.name || '',
          toTeamId: t.toTeam?.id || null,
          toTeamName: t.toTeam?.name || ''
        });
      }
    }
  }

  return Array.from(map.values())
    .map(g => {
      g.matchedUsers = USERS.filter(u => g.teamIds.has(u.teamId));
      g.category = classifyTransactionGroup(g);
      g.isInterTeam = g.matchedUsers.length >= 2;
      g.isMiLB = /minor league/i.test(g.description);
      return g;
    })
    .filter(g => g.matchedUsers.length > 0 && Array.from(g.teamIds).some(id => trackedIds.has(id)))
    .sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.id - a.id));
}

function fmtTxDate(str) {
  if (!str) return '';
  const parts = str.split('-');
  if (parts.length !== 3) return str;
  const dt = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
  return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

    return g.category === txSelectedCategory;

        <div class="tx-badges">
          ${g.isInterTeam ? '<span class="tx-badge tx-b-inter">⚡ RIVALRY TRADE</span>' : ''}
          <span class="tx-badge ${bInfo.cls}">${escHtml(bInfo.lbl)}</span>
          ${g.isMiLB ? '<span class="tx-badge tx-b-milb">MiLB</span>' : ''}
          <span class="tx-date">${escHtml(fmtTxDate(g.date))}</span>
        </div>
      </div>
      ${playersHtml}
      <div class="tx-desc">${escHtml(g.description || g.typeDesc)}</div>
    </div>`;
  }).join('');
}

async function loadTransactions() {
  const listEl = document.getElementById('tx-list');
  const sumEl = document.getElementById('tx-summary');
  const days = parseInt(document.getElementById('tx-range')?.value || '90', 10);
  const end = new Date();
  const start = new Date();
  start.setDate(end.getDate() - days);

  if (listEl) listEl.innerHTML = '<div class="tx-empty">Loading MLB trades &amp; acquisitions...</div>';
  try {
    const url = `${MLB}/transactions?teamId=${TEAM_IDS}&startDate=${isoDate(start)}&endDate=${isoDate(end)}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    txGroupedCache = groupTransactions(data.transactions || []);
    renderTxTeamPills();
    renderTransactions();
  } catch (e) {
    console.error('Failed to load transactions:', e);
    if (sumEl) sumEl.textContent = 'Could not load transactions.';
    if (listEl) listEl.innerHTML = '<div class="tx-empty">Error loading MLB transactions. Click Refresh to try again.</div>';
  }
}
/* ── END TRADES & ACQUISITIONS WIRE ── */

// Initialization
window.onload = () => {
  renderLeaderboard();
  renderTrophyLeaderboard();
  renderChats();
  renderRecentPicks();
  loadGamesForDate();
  updateBackgroundScores();
  renderTxTeamPills();
  loadTransactions();
  
  // Refresh live score logic every 60s
  setInterval(updateBackgroundScores, 60000);
}

</script>
